services:
  postgres:
    image: postgres:16-alpine
    container_name: vectoros-fleet-postgres
    environment:
      POSTGRES_DB: vectoros_fleet
      POSTGRES_USER: vectoros
      POSTGRES_PASSWORD: vectoros
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectoros -d vectoros_fleet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  fleet:
    build: .
    container_name: vectoros-fleet
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vectoros_fleet
      DB_USER: vectoros
      DB_PASSWORD: vectoros
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
