server:
  port: 8080

spring:
  application:
    name: vectoros-fleet
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vectoros_fleet}
    username: ${DB_USER:vectoros}
    password: ${DB_PASSWORD:vectoros}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

vectoros:
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:vectoros-fleet}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    qos: ${MQTT_QOS:1}
    keep-alive-interval: ${MQTT_KEEP_ALIVE:60}
    connection-timeout: ${MQTT_CONNECTION_TIMEOUT:30}
    automatic-reconnect: true
    clean-session: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
